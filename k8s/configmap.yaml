apiVersion: v1
kind: ConfigMap
metadata:
  name: janmeter-ai-config
  labels:
    app.kubernetes.io/name: janmeter-ai-service
data:
  SPRING_PROFILES_ACTIVE: "dev"
  SERVER_PORT: "8089"
  OPENAI_MODEL: "gpt-5-mini"
  POLITICIAN_AI_TIMEOUT: "PT9M"
  POLITICIAN_AI_RESEARCH_MODEL: "gpt-6-luna"
  POLITICIAN_AI_RESEARCH_REASONING_EFFORT: "none"
  POLITICIAN_AI_RESEARCH_CACHE_TTL: "P7D"
  POLITICIAN_AI_RESEARCH_MAX_OUTPUT_TOKENS: "5000"
  JANMETER_KAFKA_ENABLED: "true"
  SPRING_DATA_REDIS_HOST: "redis"
  SPRING_DATA_REDIS_PORT: "6379"
  DB_POOL_MAX_SIZE: "3"
  DB_POOL_MIN_IDLE: "1"
  DB_POOL_CONNECTION_TIMEOUT_MS: "30000"
  DB_POOL_IDLE_TIMEOUT_MS: "60000"
  DB_POOL_MAX_LIFETIME_MS: "600000"
