apiVersion: v1
kind: ConfigMap
metadata:
  name: janmeter-ai-config
  labels:
    app.kubernetes.io/name: janmeter-ai-service
data:
  SPRING_PROFILES_ACTIVE: "prod"
  SERVER_PORT: "8089"
  OPENAI_MODEL: "gpt-5-mini"
  POLITICIAN_AI_TIMEOUT: "PT9M"
  POLITICIAN_AI_RESEARCH_MODEL: "gpt-6-luna"
  POLITICIAN_AI_RESEARCH_REASONING_EFFORT: "none"
  POLITICIAN_AI_RESEARCH_CACHE_TTL: "P7D"
  POLITICIAN_AI_RESEARCH_MAX_OUTPUT_TOKENS: "5000"
  JANMETER_KAFKA_ENABLED: "true"
  JANMETER_FEED_WORKER_ENABLED: "true"
  FEED_ENGAGEMENT_TOPIC: "janmeter.feed.engagement.v1"
  FEED_SESSION_TOPIC: "janmeter.feed.session.v1"
  FEED_VOTE_TOPIC: "janmeter.vote.cast.v1"
  FEED_PROFILE_UPDATED_TOPIC: "janmeter.profile.updated.v1"
  FEED_WORK_UPDATED_TOPIC: "janmeter.work.updated.v1"
  FEED_CONSTITUENCY_ASSIGNED_TOPIC: "janmeter.constituency.assigned.v1"
  FEED_REBUILD_TOPIC: "janmeter.feed.rebuild.v1"
  FEED_RETRY_TOPIC: "janmeter.feed.retry.v1"
  FEED_DLT_TOPIC: "janmeter.feed.dlt.v1"
  JANMETER_FEED_REBUILD_DELAY: "10m"
  JANMETER_FEED_RANKING_DECAY_DELAY: "6h"
  JANMETER_FEED_OUTBOX_DELAY: "2s"
  JANMETER_FEED_CLEANUP_DELAY: "24h"
  SPRING_DATA_REDIS_HOST: "redis"
  SPRING_DATA_REDIS_PORT: "6379"
  DB_POOL_MAX_SIZE: "6"
  DB_POOL_MIN_IDLE: "2"
  DB_POOL_CONNECTION_TIMEOUT_MS: "30000"
  DB_POOL_IDLE_TIMEOUT_MS: "60000"
  DB_POOL_MAX_LIFETIME_MS: "600000"
