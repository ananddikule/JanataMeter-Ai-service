spring.application.name=JanMeterAiService
spring.profiles.default=local
# JanMeter Service owns the shared schema through Liquibase. AI Service keeps JPA mappings only for the
# party data used by politician discovery; location matching uses read-only SQL against the canonical schema.
spring.jpa.hibernate.ddl-auto=none
spring.liquibase.enabled=false
spring.data.redis.repositories.enabled=false
spring.ai.model.chat=openai
spring.ai.openai.chat.model=${OPENAI_MODEL:gpt-5-mini}
server.port=8089
server.servlet.context-path=/janmeter-ai-service
spring.servlet.multipart.max-file-size=8MB
spring.servlet.multipart.max-request-size=16MB
janmeter.face-match.cosine-threshold=${JANMETER_FACE_MATCH_COSINE_THRESHOLD:0.363}
spring.kafka.bootstrap-servers=${SPRING_KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
spring.kafka.producer.acks=all
spring.kafka.producer.properties.enable.idempotence=true
spring.kafka.producer.properties.compression.type=zstd
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.consumer.enable-auto-commit=false
spring.kafka.consumer.auto-offset-reset=earliest
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.apache.kafka.common.serialization.StringDeserializer
janmeter.kafka.constituency.request-topic=${CONSTITUENCY_REQUEST_TOPIC:janmeter.user-address-constituency-match.request.v1}
janmeter.kafka.constituency.result-topic=${CONSTITUENCY_RESULT_TOPIC:janmeter.user-address-constituency-match.result.v1}
janmeter.kafka.constituency.retry-topic=${CONSTITUENCY_RETRY_TOPIC:janmeter.user-address-constituency-match.retry.v1}
janmeter.kafka.constituency.dlt-topic=${CONSTITUENCY_DLT_TOPIC:janmeter.user-address-constituency-match.dlt.v1}
