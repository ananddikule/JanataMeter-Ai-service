spring.application.name=JanMeterAiService
spring.profiles.default=local
# JanMeter Service owns the shared schema through Liquibase. AI Service keeps JPA mappings only for the
# party data used by politician discovery; location matching uses read-only SQL against the canonical schema.
spring.jpa.hibernate.ddl-auto=none
spring.liquibase.enabled=false
spring.data.redis.repositories.enabled=false
spring.ai.model.chat=openai
spring.ai.openai.chat.model=${OPENAI_MODEL:gpt-5-mini}
spring.ai.openai.api-key=${OPENAI_API_KEY:}
janmeter.ai.politician.timeout=${POLITICIAN_AI_TIMEOUT:PT9M}
janmeter.ai.politician.research-model=${POLITICIAN_AI_RESEARCH_MODEL:gpt-6-luna}
janmeter.ai.politician.research-reasoning-effort=${POLITICIAN_AI_RESEARCH_REASONING_EFFORT:none}
janmeter.ai.politician.research-cache-ttl=${POLITICIAN_AI_RESEARCH_CACHE_TTL:P7D}
janmeter.ai.politician.research-max-output-tokens=${POLITICIAN_AI_RESEARCH_MAX_OUTPUT_TOKENS:5000}
janmeter.ai.openai.responses-url=${OPENAI_RESPONSES_URL:https://api.openai.com/v1/responses}
server.port=8089
server.servlet.context-path=/janmeter-ai-service
spring.servlet.multipart.max-file-size=8MB
spring.servlet.multipart.max-request-size=16MB
janmeter.face-match.cosine-threshold=${JANMETER_FACE_MATCH_COSINE_THRESHOLD:0.363}
spring.kafka.bootstrap-servers=${SPRING_KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
janmeter.kafka.enabled=${JANMETER_KAFKA_ENABLED:false}
spring.kafka.producer.acks=all
spring.kafka.producer.properties.enable.idempotence=true
spring.kafka.producer.properties.compression.type=zstd
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.consumer.enable-auto-commit=false
spring.kafka.consumer.auto-offset-reset=earliest
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.apache.kafka.common.serialization.StringDeserializer
janmeter.kafka.constituency.request-topic=${CONSTITUENCY_REQUEST_TOPIC:janmeter.user-address-constituency-match.request.v1}
janmeter.kafka.constituency.result-topic=${CONSTITUENCY_RESULT_TOPIC:janmeter.user-address-constituency-match.result.v1}
janmeter.kafka.constituency.retry-topic=${CONSTITUENCY_RETRY_TOPIC:janmeter.user-address-constituency-match.retry.v1}
janmeter.kafka.constituency.dlt-topic=${CONSTITUENCY_DLT_TOPIC:janmeter.user-address-constituency-match.dlt.v1}
janmeter.feed.worker.enabled=${JANMETER_FEED_WORKER_ENABLED:false}
janmeter.kafka.feed.engagement-topic=${FEED_ENGAGEMENT_TOPIC:janmeter.feed.engagement.v1}
janmeter.kafka.feed.session-topic=${FEED_SESSION_TOPIC:janmeter.feed.session.v1}
janmeter.kafka.feed.vote-topic=${FEED_VOTE_TOPIC:janmeter.vote.cast.v1}
janmeter.kafka.feed.profile-updated-topic=${FEED_PROFILE_UPDATED_TOPIC:janmeter.profile.updated.v1}
janmeter.kafka.feed.work-updated-topic=${FEED_WORK_UPDATED_TOPIC:janmeter.work.updated.v1}
janmeter.kafka.feed.constituency-assigned-topic=${FEED_CONSTITUENCY_ASSIGNED_TOPIC:janmeter.constituency.assigned.v1}
janmeter.kafka.feed.rebuild-topic=${FEED_REBUILD_TOPIC:janmeter.feed.rebuild.v1}
janmeter.kafka.feed.retry-topic=${FEED_RETRY_TOPIC:janmeter.feed.retry.v1}
janmeter.kafka.feed.dlt-topic=${FEED_DLT_TOPIC:janmeter.feed.dlt.v1}
janmeter.feed.rebuild-delay=${JANMETER_FEED_REBUILD_DELAY:10m}
janmeter.feed.ranking-decay-delay=${JANMETER_FEED_RANKING_DECAY_DELAY:6h}
janmeter.feed.outbox-delay=${JANMETER_FEED_OUTBOX_DELAY:2s}
janmeter.feed.cleanup-delay=${JANMETER_FEED_CLEANUP_DELAY:24h}
