spring.application.name=JanMeterAiService
spring.profiles.default=local
# JanMeter Service owns the shared schema through its Liquibase changelog. The AI service only reads legacy
# geographic tables and exposes AI endpoints, so it must not validate an older entity snapshot at startup.
spring.jpa.hibernate.ddl-auto=none
spring.liquibase.enabled=false
spring.ai.model.chat=openai
spring.ai.openai.chat.model=${OPENAI_MODEL:gpt-5-mini}
server.port=8089
server.servlet.context-path=/janmeter-ai-service
